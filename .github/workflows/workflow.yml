name: Newflow.yml
on:
   push:
     branches:
       - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set-up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build maven project
        run: mvn clean package
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: build Docker image
        run:  docker build -t hello-maven:latest .
      - name: Tag Docker image
        run: docker tag hello-maven:latest ${{ secrets.DOCKER_USERNAME }}/sample-hello-maven:latest
      - name: Test application
        run: java -jar target/HelloMaven-1.0-SNAPSHOT.jar
      - name: Push image
        run:  docker push ${{ secrets.DOCKER_USERNAME }}/sample-hello-maven:latest
